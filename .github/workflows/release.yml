name: Release

# GitHub tag filters are globs, not regexes: `+` repeats the preceding
# character class, `*` matches any run of non-`/` characters. This pattern is
# therefore only a coarse pre-filter (it also admits e.g. `v1.2.3foo`);
# the `verify` job enforces strict SemVer and rejects anything else.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # "true" only for a SemVer prerelease tag (e.g. v1.2.3-rc.1); consumed by
      # the release job (GitHub prerelease flag) and update-homebrew (skip).
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/validate-release-tag.sh
      - name: Classify release channel
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The tag was validated as strict SemVer above, so a '-' directly
          # after MAJOR.MINOR.PATCH is exactly a prerelease suffix.
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-. ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --tag v0.2.5 # commit 88f49ff79e777bef6d3564531636ee4d3cc2f8d2
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use-cross }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar czf "mobhook-$TARGET.tar.gz" -C "target/$TARGET/release" mobhook
          shasum -a 256 "mobhook-$TARGET.tar.gz" > "mobhook-$TARGET.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobhook-${{ matrix.target }}
          path: |
            mobhook-${{ matrix.target }}.tar.gz
            mobhook-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Verify artifacts and write SHA256SUMS
        run: |
          cd dist
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            f="mobhook-$t.tar.gz"
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "missing artifact for $t" >&2; exit 1; }
            # per-artifact checksum written by the build job: detects any change in transit
            shasum -a 256 -c "$f.sha256"
          done
          shasum -a 256 mobhook-*.tar.gz > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          [ "$(wc -l < SHA256SUMS | tr -d ' ')" = "4" ] || { echo "unexpected SHA256SUMS size" >&2; exit 1; }
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/mobhook-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          # string "true"/"false" from the verify job; "true" marks the release as a prerelease
          prerelease: ${{ needs.verify.outputs.prerelease }}

  update-homebrew:
    needs: [verify, release]
    # Never let a prerelease tag overwrite the stable Homebrew formula.
    # Fail-closed: runs only when verify explicitly classified the tag as stable.
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: PRODUCTION
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            -D "$RUNNER_TEMP/assets" \
            -p 'mobhook-*.tar.gz' -p SHA256SUMS

      - name: Checkout homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: iqbal-mekari/homebrew-mobhook
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-mobhook
          persist-credentials: false

      - name: Verify assets and render formula
        run: |
          cd "$RUNNER_TEMP/assets"
          # every downloaded tarball must match the checksums published by the release job
          shasum -a 256 -c SHA256SUMS
          sum_of() {
            awk -v f="$1" '$2 == f { print $1; n++ } END { exit (n == 1 ? 0 : 1) }' SHA256SUMS
          }
          ARM_MAC="$(sum_of mobhook-aarch64-apple-darwin.tar.gz)"
          X64_MAC="$(sum_of mobhook-x86_64-apple-darwin.tar.gz)"
          ARM_LINUX="$(sum_of mobhook-aarch64-unknown-linux-musl.tar.gz)"
          X64_LINUX="$(sum_of mobhook-x86_64-unknown-linux-musl.tar.gz)"
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/render-formula.sh "${RELEASE_TAG#v}" \
            "$ARM_MAC" "$X64_MAC" "$ARM_LINUX" "$X64_LINUX" \
            homebrew-mobhook/Formula/mobhook.rb

      - name: Commit and push
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod u+x .github/scripts/git-askpass.sh
          cd homebrew-mobhook
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mobhook.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date, skipping."
          else
            git commit -m "Update mobhook to ${RELEASE_TAG}"
            # token reaches git only through the environment via GIT_ASKPASS
            GIT_ASKPASS="$GITHUB_WORKSPACE/.github/scripts/git-askpass.sh" \
              GIT_TERMINAL_PROMPT=0 \
              git -c credential.helper= push origin HEAD
          fi
