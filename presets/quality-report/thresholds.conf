# =============================================================================
# quality-report thresholds
# =============================================================================
# Sourced by script.sh as plain bash. Edit values here; no script changes needed.
# Ratings use A (best) to E (worst).
#
# ASSUMPTION: bands follow the standard SonarQube scheme. Confirm against the
# SonarQube documentation before relying on them as a quality gate.

# --- Reliability / Security rating -------------------------------------------
# Rating is driven by the worst open severity in the category:
#   none -> A, low -> B, medium -> C, high -> D, blocker -> E
# (rule is fixed in script.sh; severities are mapped per tool, see README)

# --- Maintainability rating (technical debt ratio, %) ------------------------
# Upper bound of each band: A <= 5, B <= 10, C <= 20, D <= 50, otherwise E
DEBT_RATIO_BANDS="5 10 20 50"

# Estimated remediation effort per open code smell, in minutes
DEBT_MIN_LOW=5
DEBT_MIN_MEDIUM=15
DEBT_MIN_HIGH=30

# Estimated cost to develop one line of code, in minutes
DEV_COST_PER_LINE_MIN=30

# --- Security Hotspots review rating (% of hotspots accepted/reviewed) -------
# Lower bound of each band: A >= 80, B >= 70, C >= 50, D >= 30, otherwise E
# No hotspots => A. A hotspot counts as reviewed when it is listed in baseline.txt.
HOTSPOT_REVIEW_BANDS="80 70 50 30"

# --- Duplications -------------------------------------------------------------
DUPLICATION_MIN_LINES=5
DUPLICATION_MIN_TOKENS=50

# --- Optional gate (blocking) -------------------------------------------------
# Default: empty / 0 = report only, the hook never fails.
# Set to fail the hook (exit 1) when a threshold is breached. Use together with
# a blocking hook mode in mobhook.yaml for the push to actually be rejected.
#
# Fail when any of Security / Reliability / Maintainability is worse than this
# rating (e.g. "B" fails on C, D or E). Empty disables the check.
FAIL_ON_RATING_WORSE_THAN=""
# Fail when line coverage (%) is below this value. 0 disables the check.
FAIL_ON_COVERAGE_BELOW=0
# Fail when duplicated lines (%) exceed this value. Empty disables the check.
FAIL_ON_DUPLICATION_ABOVE=""
